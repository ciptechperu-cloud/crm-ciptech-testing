<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>CRM Ciptech</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #e9ecef;
    }

    .campo {
      margin-top: 16px;
    }

    .campo-label {
      display: block;
      margin: 0 0 8px;
      color: #123E7A;
      font-size: 14px;
      font-weight: 700;
      text-align: left;
    }

    .field-error {
      margin: -2px 0 8px;
      color: #a32424;
      font-size: 13px;
      font-weight: 600;
      text-align: left;
    }

    [aria-invalid="true"] {
      border-color: #a32424 !important;
    }

    .modo-cotizacion {
      display: none;
      margin: 0 0 12px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #edf3fb;
      color: #123E7A;
      text-align: left;
    }

    .modo-cotizacion[data-modo="nueva"] {
      background: #ecf8e9;
      color: #256a29;
    }

    .modo-cotizacion strong,
    .modo-cotizacion span {
      display: block;
    }

    .modo-cotizacion span {
      margin-top: 3px;
      font-size: 13px;
    }

    .ov-valores-sugeridos {
      display: none;
      margin: 0 0 12px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #edf3fb;
      color: #123E7A;
      font-size: 13px;
      line-height: 1.4;
      text-align: left;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 52px;
      margin: 0;
      padding: 13px 14px;
      border-radius: 14px;
      border: 1px solid #3b3b3b;
      font-size: 16px;
      background: white;
      outline: none;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 3px solid #7ED957;
      outline-offset: 3px;
      border-color: #123E7A;
      box-shadow: 0 0 0 1px #123E7A;
    }

    [aria-invalid="true"]:focus-visible {
      outline-color: #d35b5b;
      border-color: #a32424;
      box-shadow: 0 0 0 1px #a32424;
    }

    .campo input + .campo-label,
    .campo select + .campo-label {
      margin-top: 14px;
    }

    #asesor {
      font-weight: bold;
      background: #3168b2;
      color: #fff;
    }

    #estadoInicial {
      font-weight: bold;
      background: #3168b2;
      color: #fff;
    }

    #bloqueCotizacion {
      margin-bottom: 0;
    }

    #bloqueGestionCot select {
      margin-bottom: 0;
    }

    #estadoPostCot {
      font-weight: bold;
      background: #3168b2;
      color: #fff;
    }

    /* Agregado */
    #estadoAvanzado {
      font-weight: bold;
      background: #3168b2;
      color: #fff;
    }

    #listaCotizaciones {
      margin-bottom: 0;
      font-weight: bold;
      background: #3168b2;
      color: #fff;

    }

    /* APP CONTAINER */

    .app {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* CARD */

    .card {
      background: white;
      width: 100%;
      max-width: 420px;
      border-radius: 18px;
      padding: 28px 22px 32px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .15);
      text-align: center;
      position: relative;
    }

    /* TITULOS */

    .t1 {
      color: #7ED957;
      font-size: 27px;
      font-weight: bold;
      margin-bottom: 1px;
    }

    .t2 {
      color: #123E7A;
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 22px;
    }

    /* BUTTON */

    button {
      width: 100%;
      min-height: 52px;
      padding: 12px 16px;
      border: none;
      border-radius: 14px;
      background: #1f4a83;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: .2s;
    }

    /* nuevo */
    button:hover {
      transform: scale(0.98);
    }

    button:active {
      transform: scale(.97);
    }

    #zonaGestion button {
      margin-top: 24px;
    }

    #zonaGestion {
      margin-top: 18px;
      text-align: left;
    }

    .seccion-contexto,
    .seccion-gestion {
      padding: 18px;
      border-radius: 16px;
    }

    .seccion-contexto {
      background: #f4f7fb;
      border: 1px solid #d7e2f0;
    }

    .seccion-gestion {
      margin-top: 18px;
      border: 1px solid #dfe5ec;
      background: #fff;
      box-shadow: 0 6px 16px rgba(18, 62, 122, .07);
    }

    .seccion-encabezado {
      margin-bottom: 14px;
    }

    .seccion-titulo {
      margin: 0;
      color: #123E7A;
      font-size: 18px;
      line-height: 1.3;
    }

    .seccion-ayuda {
      margin: 4px 0 0;
      color: #596b82;
      font-size: 13px;
      line-height: 1.4;
    }

    .seccion-contexto .box {
      margin-top: 0;
      text-align: left;
    }

    .seccion-gestion .campo:first-of-type {
      margin-top: 0;
    }

    .seccion-gestion .btnGuardar {
      margin-bottom: 0;
    }

    #btnBuscarLead {
      margin-top: 16px;
    }

    .btn-mini {
      position: absolute;
      top: 18px;
      right: 18px;
      background: #1f4e8c;
      color: #fff;
      border: none;
      min-height: 38px;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: none;
      line-height: 1.2;
      box-shadow: 0 3px 8px rgba(18, 62, 122, .2);
    }

    .btn-mini {
      width: auto !important;
      display: none;
    }

    /* LOADER */

    .loader {
      display: none;
      margin: 16px 0;
      color: #123E7A;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
    }

    .spinner {
      display: inline-block;
      width: 28px;
      height: 28px;
      border: 4px solid #ddd;
      border-top: 4px solid #1f4a83;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 8px 0 0;
      vertical-align: middle;
    }

    .loader-text {
      vertical-align: middle;
    }

    @keyframes spin {
      0% {
        transform: rotate(0)
      }

      100% {
        transform: rotate(360deg)
      }
    }

    /* INFO */

    .box {
      background: #dfe6ef;
      padding: 14px;
      border-radius: 12px;
      font-weight: bold;
      color: #123E7A;
      margin-top: 16px;
      display: none;
    }

    .estado {
      margin-top: 18px;
      font-size: 17px;
      color: #123E7A;
    }

    /* ESTADO DE CARGA CRM */
    .crm-status {
      display: none;
      margin: 14px 0 0;
      padding: 12px 14px;
      border-radius: 12px;
      background: #edf3fb;
      color: #123e7a;
      font-size: 14px;
      line-height: 1.4;
      text-align: left;
      align-items: flex-start;
      gap: 9px;
    }

    .crm-status::before {
      display: inline-flex;
      flex: 0 0 20px;
      width: 20px;
      height: 20px;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #123e7a;
      color: #fff;
      content: "i";
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
    }

    .crm-status[data-type="success"]::before {
      content: "✓";
      background: #256a29;
    }

    .crm-status[data-type="error"]::before {
      content: "!";
      background: #a32424;
    }

    .crm-status[data-type="error"] {
      background: #fff0f0;
      color: #a32424;
    }

    .crm-status[data-type="success"] {
      background: #ecf8e9;
      color: #256a29;
    }

    .lead-resumen {
      display: none;
      position: sticky;
      top: 10px;
      z-index: 2;
      margin: 14px 0;
      padding: 10px 12px;
      border: 1px solid #b7cce7;
      border-radius: 12px;
      background: #f5f9ff;
      color: #123E7A;
      box-shadow: 0 4px 12px rgba(18, 62, 122, .12);
      text-align: left;
    }

    .lead-resumen-principal {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px 8px;
    }

    .lead-resumen-id,
    .lead-resumen-empresa {
      font-size: 14px;
      line-height: 1.35;
    }

    .lead-resumen-empresa {
      font-weight: 700;
    }

    .lead-resumen-estado {
      padding: 2px 8px;
      border-radius: 999px;
      background: #dceafa;
      font-size: 12px;
      font-weight: 700;
    }
.lead-resumen-estado[data-estado="SIN_GESTIONAR"] {
  background: #e5e7eb;
  color: #374151;
}
.lead-resumen-estado[data-estado="ATENDIDO"] {
  background: #dbeafe;
  color: #1d4ed8;
}
.lead-resumen-estado[data-estado="COTIZADO"] {
  background: #fef3c7;
  color: #92400e;
}
.lead-resumen-estado[data-estado="CERRADO"] {
  background: #dcfce7;
  color: #166534;
}
.lead-resumen-estado[data-estado="PERDIDO"] {
  background: #fee2e2;
  color: #b91c1c;
}

    button:disabled {
      opacity: 0.68;
      cursor: wait;
      transform: none !important;
    }

    /* MOBILE FULL APP */

    @media (min-width: 768px) {

      .app {
        padding: 40px 24px;
      }

      .card {
        max-width: 900px;
        padding: 36px 40px 42px;
      }

      .card > .campo-label,
      #idLead,
      #btnBuscarLead,
      #crmStatus {
        max-width: 520px;
        margin-left: auto;
        margin-right: auto;
      }

      #btnBuscarLead {
        display: block;
        margin-top: 16px;
      }

      #zonaGestion[style*="display: block"] {
        display: grid !important;
        grid-template-columns: minmax(250px, .85fr) minmax(0, 1.35fr);
        gap: 22px;
        align-items: start;
      }

      .seccion-gestion {
        margin-top: 0;
      }
    }

    @media (max-width: 767px) {

      .app {
        align-items: flex-start;
        padding: 0;
      }

      .card {
        max-width: 100%;
        min-height: 100dvh;
        border-radius: 0;
        box-shadow: none;
        padding: 68px 18px calc(24px + env(safe-area-inset-bottom));
      }

      .seccion-contexto,
      .seccion-gestion {
        padding: 16px;
      }

      .lead-resumen {
        top: 8px;
      }

      #zonaGestion {
        margin-top: 16px;
      }

    }
  </style>

</head>

<body>

  <div class="app">

    <div class="card">

      <div class="t1">Atención Leads</div>
      <div class="t2">MKT Ciptech</div>

      <!-- BOTON NUEVA BUSQUEDA -->
      <button id="btnBuscarMini" onclick="nuevaBusqueda()" class="btn-mini"
        aria-label="Iniciar una nueva búsqueda de lead" title="Limpiar el lead actual y buscar otro">
        <span aria-hidden="true">↻</span> Nueva búsqueda
      </button>

      <!-- COLOCAR ID DEL LEAD -->
      <label class="campo-label" for="idLead">ID del lead</label>
      <input id="idLead" placeholder="ID Lead">

      <!-- BOTON DE BUSCAR LEAD -->
      <button id="btnBuscarLead" onclick="buscar()">Buscar lead</button>

      <div class="loader" id="loader" role="status" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <span class="loader-text">Buscando lead...</span>
      </div>

      <div id="crmStatus" class="crm-status" role="status" aria-live="polite"></div>

      <div id="leadResumen" class="lead-resumen" aria-live="polite">
        <div class="lead-resumen-principal">
          <span id="leadResumenId" class="lead-resumen-id"></span>
          <span aria-hidden="true">·</span>
          <span id="leadResumenEmpresa" class="lead-resumen-empresa"></span>
          <span id="leadResumenEstado" class="lead-resumen-estado"></span>
        </div>
      </div>

      <!-- DESPLEGABLES -->
      <div id="zonaGestion" style="display:none">

        <section class="seccion-contexto" aria-labelledby="tituloDatosLead">
          <div class="seccion-encabezado">
            <h3 id="tituloDatosLead" class="seccion-titulo">Datos del lead</h3>
            <p class="seccion-ayuda">Información de referencia para esta gestión.</p>
          </div>
          <div id="info" class="box"></div>
          <div id="estado" class="estado"></div>
          <div class="boxInfo" id="infoLead"></div>
        </section>

        <section class="seccion-gestion" aria-labelledby="tituloRegistrarGestion">
          <div class="seccion-encabezado">
            <h3 id="tituloRegistrarGestion" class="seccion-titulo">Registrar gestión</h3>
            <p class="seccion-ayuda">Selecciona la acción y completa únicamente los datos necesarios.</p>
          </div>

        <div id="bloqueAsesor" class="campo">
          <label class="campo-label" for="asesor">Asesor</label>
          <select id="asesor">
            <option value="">Seleccionar Asesor</option>
            <option>Herson Zevallos</option>
            <option>Richard Palacios</option>
            <option>Luz Arone</option>
            <option>Peter Sanchez</option>
            <option>Daniel Bravo</option>
            <option>Kris Cruz</option>
            <option>Noelia Chavez</option>
            <option>Bryan Rojas</option>
            <option>Chris Rojas</option>
            <option>Sofia Panduro</option>
            <option>Alberto Escajadillo</option>
            <option>Luis Aguedo</option>
            <option>Evert Silva</option>
            <option>Sara Barreto</option>
            <option>Julio Blanco</option>
            <option>Alexander Davila</option>
            <option>SERTEC CPEI</option>
            <option>SERTEC Inspección</option>
            <option>Raúl Albornoz</option>
            <option>Marco Chavez</option>
            <option>MKT</option>
          </select>
        </div>

        <div id="bloqueEstadoInicial" class="campo">
          <label class="campo-label" for="estadoInicial">Estado inicial</label>
          <select id="estadoInicial">
            <option value="">Seleccionar Estado</option>
            <option>ATENDIDO</option>
          </select>
        </div>

        <!-- DROPDOWN DESPUES DE ATENCIÓN -->
        <div id="bloqueEstadoAvanzado" class="campo">
          <label class="campo-label" for="estadoAvanzado">Siguiente acción</label>
          <select id="estadoAvanzado">
            <option value="">Seleccionar Estado</option>
            <option>COTIZADO</option>
            <option>PERDIDO</option>
          </select>
        </div>

        <!-- DROPDOWN DESPUES DE COTIZACIÓN -->
        <div id="bloqueGestionCot" class="campo" style="display:none">

          <label class="campo-label" for="listaCotizaciones">N.º de cotización</label>
          <select id="listaCotizaciones"></select>

        </div>

        <!-- CAMPOS PARA COTIZACIÓN -->
        <div id="bloqueCotizacion" class="campo" style="display:none">

          <div id="modoCotizacion" class="modo-cotizacion" aria-live="polite">
            <strong id="modoCotizacionTitulo"></strong>
            <span id="modoCotizacionDetalle"></span>
          </div>

          <label class="campo-label" for="monedaCot">Moneda de cotización</label>
          <select id="monedaCot">
            <option value="">Tipo Moneda</option>
            <option>PEN</option>
            <option>USD</option>
          </select>

          <label class="campo-label" for="montoCot">Monto de cotización</label>
          <input id="montoCot" placeholder="Monto de Cotización">

          <label class="campo-label" for="numCot">N.º de cotización</label>
          <input id="numCot" type="text" inputmode="numeric" autocomplete="off"
            maxlength="6" pattern="[0-9]{6}" placeholder="N.º de cotización (6 dígitos)">

        </div>

        <div id="bloqueEstadoPostCot" class="campo" style="display:none">
          <label class="campo-label" for="estadoPostCot">Resultado comercial</label>
          <select id="estadoPostCot">
            <option value="">Seleccionar Estado</option>
            <option>CERRADO</option>
            <option>PERDIDO</option>
          </select>
        </div>

        <div id="bloquePerdido" class="campo" style="display:none">
          <label class="campo-label" for="motivoPerdido">Motivo de pérdida</label>
          <textarea id="motivoPerdido" placeholder="Motivo de pérdida"></textarea>
        </div>

        <div id="bloqueOV" class="campo" style="display:none">
          <div id="ovValoresSugeridos" class="ov-valores-sugeridos" aria-live="polite"></div>
          <select id="listaOV" style="display:none"></select>
          <label class="campo-label" for="monedaOV">Moneda de la orden de venta</label>
          <select id="monedaOV">
            <option value="">Tipo Moneda</option>
            <option>PEN</option>
            <option>USD</option>
          </select>
          <label class="campo-label" for="montoOV">Monto de cierre</label>
          <input id="montoOV" placeholder="Monto de Cierre">
          <label class="campo-label" for="numOV">N.º de orden de venta</label>
          <input id="numOV" type="text" inputmode="numeric" autocomplete="off"
            maxlength="5" pattern="[0-9]{5}" placeholder="N.º de orden de venta (5 dígitos)">
        </div>



        <button class="btnGuardar" onclick="guardar()">Guardar Cambios</button>
        </section>
      </div>

    </div>

  </div>

  <script>

    const URL = "https://script.google.com/macros/s/AKfycbymjhSVRSa3KIekqlyK4g36dQQ-lwJWTesBcpSZbRUziuysdl7Z9qGT-yW1F5qLJLU7/exec";

    let leadActivo = null
    let estadoLeadActivo = ""

    let crmBuscando = false;

    let crmGuardando = false;
    let crmRecargaPendiente = null;

    function crmEstadoGuardado(activo) {
      const boton = document.querySelector(".btnGuardar");
      const controlesContexto = [
        document.getElementById("asesor"),
        document.getElementById("idLead"),
        document.getElementById("btnBuscarLead"),
        document.getElementById("btnBuscarMini")
      ];

      crmGuardando = activo;
      boton.disabled = activo;
      boton.textContent = activo ? "Guardando..." : "Guardar Cambios";
      controlesContexto.forEach(control => {
        if (control) control.disabled = activo;
      });

      if (activo) {
        crmMensaje(
          "Guardando los cambios. No cierres esta ventana.",
          "info"
        );
      }
    }

    function crmCancelarGuardado(mensaje) {
      crmEstadoGuardado(false);
      crmMensaje(mensaje, "error");
    }

    function crmMostrarErrorCampo(id, mensaje) {
      const campo = document.getElementById(id);
      const errorId = "error-" + id;
      let error = document.getElementById(errorId);

      if (!error) {
        error = document.createElement("div");
        error.id = errorId;
        error.className = "field-error";
        campo.insertAdjacentElement("afterend", error);
      }

      error.textContent = mensaje;
      campo.setAttribute("aria-invalid", "true");
      campo.setAttribute("aria-describedby", errorId);
    }

    function crmLimpiarErrorCampo(id) {
      const campo = document.getElementById(id);
      const error = document.getElementById("error-" + id);

      if (error) error.remove();
      if (campo) {
        campo.removeAttribute("aria-invalid");
        campo.removeAttribute("aria-describedby");
      }
    }

    function crmLimpiarErroresCampos() {
      document.querySelectorAll(".field-error").forEach(error => {
        crmLimpiarErrorCampo(error.id.replace("error-", ""));
      });
    }

    function crmCancelarPorCampo(id, mensaje) {
      crmEstadoGuardado(false);
      crmMostrarErrorCampo(id, mensaje);
      document.getElementById(id).focus();
    }

    function crmModoCotizacion(modo, titulo = "", detalle = "") {
      const contenedor = document.getElementById("modoCotizacion");
      document.getElementById("modoCotizacionTitulo").textContent = titulo;
      document.getElementById("modoCotizacionDetalle").textContent = detalle;
      contenedor.dataset.modo = modo;
      contenedor.style.display = modo ? "block" : "none";
    }

function normalizarEstadoChip(estado) {
  return String(estado || "").trim().toUpperCase().replace(/\s+/g, "_");
}

function actualizarResumenLead(lead) {
      document.getElementById("leadResumenId").textContent = lead.id || "-";
      document.getElementById("leadResumenEmpresa").textContent = lead.empresa || "-";
  const chipEstado = document.getElementById("leadResumenEstado");
  const estado = lead.estado || "-";
  chipEstado.textContent = estado;
  chipEstado.dataset.estado = normalizarEstadoChip(estado);
      document.getElementById("leadResumen").style.display = "block";
    }

    function limpiarResumenLead() {
      document.getElementById("leadResumen").style.display = "none";
      document.getElementById("leadResumenId").textContent = "";
      document.getElementById("leadResumenEmpresa").textContent = "";
  const chipEstado = document.getElementById("leadResumenEstado");
  chipEstado.textContent = "";
  chipEstado.removeAttribute("data-estado");
    }

    function crmMensaje(texto, tipo = "info") {
      const elemento = document.getElementById("crmStatus");

      elemento.textContent = texto;
      elemento.dataset.type = tipo;
      elemento.style.display = texto ? "flex" : "none";
    }

    function formatearTiempoConsulta(milisegundos) {
      if (milisegundos < 1000) return Math.round(milisegundos) + " ms";
      return (milisegundos / 1000).toFixed(1).replace(".", ",") + " s";
    }

    function esIdentificadorNumerico(valor, longitud) {
      return new RegExp("^\\d{" + longitud + "}$").test(String(valor || "").trim());
    }

    function limitarCampoANumeros(id, longitud) {
      const campo = document.getElementById(id);
      campo.addEventListener("input", function () {
        campo.value = campo.value.replace(/\D/g, "").slice(0, longitud);
      });
    }

    function ocultarValoresSugeridosOV() {
      const aviso = document.getElementById("ovValoresSugeridos");
      aviso.textContent = "";

    function sugerirValoresOVDesdeCotizacion() {
      const numCot = document.getElementById("listaCotizaciones").value;
      const listaOV = document.getElementById("listaOV");
      const ovExistenteSeleccionada = listaOV.value && listaOV.value !== "NEW";

      if (!numCot || numCot === "NEW" || ovExistenteSeleccionada) {
        ocultarValoresSugeridosOV();
        return;
      }

      const cotizacion = (window.historialLead || []).find(registro =>
        String(registro.numCot).trim() === String(numCot).trim()
      );

      if (!cotizacion) {
        ocultarValoresSugeridosOV();
        return;
      }

      document.getElementById("monedaOV").value = cotizacion.monedaCot || "";
      document.getElementById("montoOV").value = cotizacion.montoCot || "";
      document.getElementById("numOV").value = "";
      document.getElementById("numOV").readOnly = false;

      const aviso = document.getElementById("ovValoresSugeridos");
      aviso.textContent = "Valores sugeridos desde la cotización " + numCot + ". Puedes modificarlos para esta orden de venta.";
      aviso.style.display = "block";

    function cancelarRecargaLead() {
      if (crmRecargaPendiente !== null) {
        clearTimeout(crmRecargaPendiente);
        crmRecargaPendiente = null;
      }
    }

    function programarRecargaLead(esperaMs = 1200, antesDeRecargar) {
      const idProgramado = leadActivo;
      if (!idProgramado) return;

      cancelarRecargaLead();

      crmRecargaPendiente = setTimeout(() => {
        crmRecargaPendiente = null;

        const idEnCampo = document.getElementById("idLead").value.trim();
        if (crmBuscando || leadActivo !== idProgramado || idEnCampo !== idProgramado) return;

        if (typeof antesDeRecargar === "function") antesDeRecargar();
        buscar(true);
      }, esperaMs);
    }

    //FUNCIÓN BUSCAR - CONSULTA DE LEADS

    function buscar(esRecargaProgramada = false) {

      if (!esRecargaProgramada) cancelarRecargaLead();

      if (crmBuscando) return;

      const id = document.getElementById("idLead").value.trim();

      if (!id) {
        crmMensaje("Ingresa un ID de lead para realizar la búsqueda.", "error");
        document.getElementById("idLead").focus();
        return;
      }

      limpiarDatosLead();
      crmEstadoBusqueda(true);
      document.getElementById("loader").style.display = "block";

      // RESET TOTAL UI + MEMORIA
      window.historialLead = [];
      window.dataOVs = {};

      document.getElementById("listaCotizaciones").innerHTML = "";
      document.getElementById("listaOV").innerHTML = "";

      document.getElementById("monedaCot").value = "";
      document.getElementById("montoCot").value = "";
      document.getElementById("numCot").value = "";

      document.getElementById("monedaOV").value = "";
      document.getElementById("montoOV").value = "";
      document.getElementById("numOV").value = "";

      document.getElementById("bloqueCotizacion").style.display = "none";
      document.getElementById("bloqueOV").style.display = "none";
      document.getElementById("bloquePerdido").style.display = "none";

      document.getElementById("estadoPostCot").value = "";

      document.getElementById("estadoAvanzado").value = "";
      document.getElementById("estadoInicial").value = "";
      document.getElementById("asesor").value = "";

      const inicioConsulta = performance.now();

      fetch(URL + "?accion=consultar&id=" + encodeURIComponent(id))

        .then(r => {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        })

        .then(data => {

          if (!data || !data.lead) {
            crmMensaje(
              "No se encontró un lead con el ID ingresado. Consulta completada en " +
              formatearTiempoConsulta(performance.now() - inicioConsulta) + ".",
              "error"
            );
            return;
          }

          window.historialLead = data.historial;
          window.dataOVs = data.ovs;

          leadActivo = id;

          // BLOQUEAR ID
          document.getElementById("idLead").readOnly = true;

          // BOTONES
          document.getElementById("btnBuscarLead").style.display = "none";
          document.getElementById("btnBuscarMini").style.display = "block";

          // INFORMACIÓN DEL LEAD
          document.getElementById("info").style.display = "block";
          document.getElementById("info").innerHTML =
            "RUC: " + data.lead.ruc +
            "<br>Teléfono: " + data.lead.telefono +
            "<br>Origen: " + (data.lead.origen || "-") +
            "<br>Asesor: " + (data.asesor || "-");

          pintarLead(data);

          crmMensaje(
            "Lead cargado correctamente en " +
            formatearTiempoConsulta(performance.now() - inicioConsulta) + ".",
            "success"
          );

        })

        .catch(error => {
          console.error("Error al consultar lead:", error);
          crmMensaje(
            "No se pudo completar la búsqueda tras " +
            formatearTiempoConsulta(performance.now() - inicioConsulta) +
            ". Verifica tu conexión e inténtalo nuevamente.",
            "error"
          );
        })

        .finally(() => {
          document.getElementById("loader").style.display = "none";
          crmEstadoBusqueda(false);
        });

    }

    //GUARDAR CAMBIOS
    function guardar() {

      if (crmGuardando) return;

      crmLimpiarErroresCampos()

      const id = leadActivo

      const asesor = document.getElementById("asesor").value

      if (!asesor || !asesor.trim()) {
        crmCancelarPorCampo("asesor", "Seleccione un asesor antes de guardar.")
        return
      }

      const estadoInicial = document.getElementById("estadoInicial").value
      const estadoAvanzado = document.getElementById("estadoAvanzado").value

      let estadoFinal = ""

      if (estadoInicial) estadoFinal = estadoInicial
      if (estadoAvanzado) estadoFinal = estadoAvanzado

      // ⭐ FORZAR COTIZADO SI YA ESTÁ EN MODO COTIZACIÓN
      if (estadoAvanzado == "COTIZADO") {
        estadoFinal = "COTIZADO"
      }

      const estadoActual = estadoLeadActivo

      // Solo exigir estado si NO está ya en COTIZADO
      if (
        !estadoFinal &&
        !estadoActual.includes("COTIZADO") &&
        !estadoActual.includes("CERRADO")
      ) {
        const campoEstado = estadoActual.includes("SIN GESTIONAR")
          ? "estadoInicial"
          : "estadoAvanzado"
        crmCancelarPorCampo(campoEstado, "Seleccione un estado.")
        return
      }

      const estadoPost = document.getElementById("estadoPostCot").value


      // 🔴 PRIORIDAD ABSOLUTA: PERDIDO (ANTES DE TODO)
      if (estadoPost == "PERDIDO" || estadoAvanzado == "PERDIDO") {

        const motivo = document.getElementById("motivoPerdido").value

        if (!motivo || motivo.trim() === "") {
          crmCancelarPorCampo("motivoPerdido", "Ingrese el motivo de pérdida.")
          return
        }

        const inicioGuardado = performance.now();
        crmEstadoGuardado(true);

        fetch(URL, {
          method: "POST",
          body: JSON.stringify({
            accion: "perdido",
            id: id,
            asesor: asesor || null,
            comentario: motivo
          })
        })
          .then(r => r.json())
          .then(resp => {
            if (resp.ok) {
              crmMensajeConTiempoDeGuardado("Se guardó la pérdida correctamente", "success", inicioGuardado)
              programarRecargaLead(1200)
            } else {
              crmMensajeConTiempoDeGuardado(resp.msg || "No se pudo guardar la pérdida", "error", inicioGuardado)
            }
          })

          .catch(error => {
            console.error("Error al guardar pérdida:", error);
            crmMensajeConTiempoDeGuardado("Error de conexión al guardar la pérdida", "error", inicioGuardado);
          })
          .finally(() => {
            crmEstadoGuardado(false);
          });

        return
      }


      // 🔥 SI NO SELECCIONA NADA, ASUMIR FLUJO COTIZACIÓN
      const estadoPostFinal = estadoPost || "COTIZADO"

      //Sección de CERRADO
      if (estadoPost == "CERRADO") {

        const numCot = document.getElementById("listaCotizaciones").value || document.getElementById("numCot").value
        const numOV = document.getElementById("numOV").value
        const montoOV = document.getElementById("montoOV").value
        const monedaOV = document.getElementById("monedaOV").value

        if (!esIdentificadorNumerico(numCot, 6)) {
          crmCancelarPorCampo("listaCotizaciones", "Seleccione una cotización válida de 6 dígitos.")
          return
        }

        if (!esIdentificadorNumerico(numOV, 5)) {
          crmCancelarPorCampo("numOV", "Ingrese un N.º de orden de venta de 5 dígitos.")
          return
        }

        if (!montoOV) {
          crmCancelarPorCampo("montoOV", "Ingrese el monto de cierre.")
          return
        }

        if (!monedaOV) {
          crmCancelarPorCampo("monedaOV", "Seleccione la moneda de la orden de venta.")
          return
        }

        const selOV = document.getElementById("listaOV").value

        const numOVFinal = selOV && selOV !== "NEW"
          ? selOV
          : document.getElementById("numOV").value

        const inicioGuardado = performance.now();
        crmEstadoGuardado(true);

        fetch(URL, {
          method: "POST",
          body: JSON.stringify({
            accion: "ov",
            id: id,
            asesor: asesor || null,
            numCot: numCot,
            monedaOV: monedaOV,
            numOV: numOVFinal,
            monto: montoOV,
          })
        })
          .then(r => r.json())
          .then(resp => {
            if (resp.ok) {
              crmMensajeConTiempoDeGuardado("Se guardó la orden de venta correctamente", "success", inicioGuardado)
              programarRecargaLead(1500, () => {
                document.getElementById("estado").innerHTML = ""
                document.getElementById("listaCotizaciones").value = ""
                document.getElementById("estadoPostCot").value = ""
                document.getElementById("listaOV").innerHTML = ""
                document.getElementById("bloqueOV").style.display = "none"
                document.getElementById("numOV").value = ""
                document.getElementById("montoOV").value = ""
                document.getElementById("monedaOV").value = ""
              })
            } else {
              crmMensajeConTiempoDeGuardado(resp.msg || "No se pudo guardar la orden de venta", "error", inicioGuardado)
            }
            console.log(resp)
          })

          .catch(error => {
            console.error("Error al guardar OV:", error);
            crmMensajeConTiempoDeGuardado("Error de conexión al guardar la orden de venta", "error", inicioGuardado);
          })
          .finally(() => {
            crmEstadoGuardado(false);
          });

        return
      }


      //Sección de Cotizado
      if (
        (estadoFinal === "COTIZADO" || estadoActual.includes("COTIZADO")) &&
        estadoAvanzado !== "PERDIDO" &&
        estadoPost !== "PERDIDO"
      ) {

        estadoFinal = "COTIZADO"

        const moneda = document.getElementById("monedaCot").value
        const monto = document.getElementById("montoCot").value

        let montoLimpio = monto.replace(",", ".").trim()

        if (isNaN(montoLimpio) || montoLimpio === "") {
          crmCancelarPorCampo("montoCot", "Ingrese un monto de cotización válido.")

          return
        }

        montoLimpio = Number(montoLimpio)

        const numCot = document.getElementById("numCot").value
        const selCot = document.getElementById("listaCotizaciones").value


        // 🔥 DEFINIR FUERA (CLAVE)
        let cotFinal = ""

        if (selCot && selCot !== "NEW") {
          cotFinal = selCot
        } else if (numCot) {
          cotFinal = numCot.trim()
        }

        if (!esIdentificadorNumerico(cotFinal, 6)) {
          const campoCotizacion = selCot && selCot !== "NEW" ? "listaCotizaciones" : "numCot"
          crmCancelarPorCampo(campoCotizacion, "Ingrese un N.º de cotización de 6 dígitos.")

          return
        }

        console.log({
          cotFinal,
          selCot,
          numCot,
          moneda,
          monto
        })

        if (!cotFinal || !moneda || montoLimpio === "" || montoLimpio === null || isNaN(montoLimpio)) {
          const campoCotizacion = !cotFinal
            ? "numCot"
            : !moneda
              ? "monedaCot"
              : "montoCot"
          crmCancelarPorCampo(campoCotizacion, "Complete este campo para guardar la cotización.")

          return
        }

        // 👇 AQUÍ VA EL LOG (CLAVE)
        console.log("DATA FINAL:", {
          cotFinal,
          moneda,
          montoLimpio,
          tipoMonto: typeof montoLimpio
        })

        const inicioGuardado = performance.now();
        crmEstadoGuardado(true);

        //-----Estado Cotizado------
        fetch(URL, {
          method: "POST",
          body: JSON.stringify({
            accion: "cotizar",
            id: id,
            asesor: asesor || null,
            moneda: moneda,
            monto: montoLimpio,
            numCot: cotFinal
          })
        })
          .then(r => r.json())
          .then(resp => {

            if (resp.ok) {

              document.getElementById("bloqueCotizacion").style.display = "none"
              document.getElementById("bloqueGestionCot").style.display = "block"

              crmMensajeConTiempoDeGuardado("Se guardó la cotización correctamente", "success", inicioGuardado)

              // REFRESH SOLO SECCIÓN
              programarRecargaLead(1500, () => {
                document.getElementById("listaCotizaciones").value = ""
              })
            } else {
              crmMensajeConTiempoDeGuardado(resp.msg || "No se pudo guardar la cotización", "error", inicioGuardado)
            }
          })

          .catch(error => {
            console.error("Error al guardar cotización:", error);
            crmMensajeConTiempoDeGuardado("Error al guardar cotización", "error", inicioGuardado);
          })
          .finally(() => {
            crmEstadoGuardado(false);
          });

        return
      }

      //----- Estado perdido


      //----- Estado atendido

      if (estadoActual.includes("COTIZADO") || estadoActual.includes("CERRADO")) {

        if (estadoPostFinal !== "COTIZADO" && estadoPostFinal !== "CERRADO") {

          crmCancelarGuardado("La acción no es válida para el estado actual del lead.")
          console.warn("Bloqueado flujo ATENDER innecesario")
          return
        }
      }

      // 🚫 BLOQUE REAL (NO ROMPE NADA)
      if (
        estadoActual.includes("ATENDIDO") ||
        estadoActual.includes("COTIZADO") ||
        estadoActual.includes("CERRADO")
      ) {
        crmCancelarGuardado("El lead ya fue gestionado y no puede volver a atenderse.")
        console.warn("ATENDER BLOQUEADO (ya gestionado)")
        return
      }

      const inicioGuardado = performance.now();
      crmEstadoGuardado(true);

      fetch(URL, {
        method: "POST",
        body: JSON.stringify({
          accion: "atender",
          id: id,
          asesor: asesor || null,
          estado: estadoFinal
        })
      })
        .then(r => r.json())
        .then(resp => {
          if (resp && resp.ok) {
            crmMensajeConTiempoDeGuardado("Se guardó la atención correctamente", "success", inicioGuardado)
            document.getElementById("bloqueCotizacion").style.display = "none"
            document.getElementById("bloqueGestionCot").style.display = "block"

            // Mantener el lead abierto y recargar su estado actualizado.
            if (estadoFinal == "ATENDIDO") {
              programarRecargaLead(1200)
            }
          }
          else {
            crmMensajeConTiempoDeGuardado(resp.msg || "No se pudo guardar la atención", "error", inicioGuardado)
          }
        })
        .catch(error => {
          console.error("Error al guardar atención:", error);
          crmMensajeConTiempoDeGuardado("Error de conexión al guardar la atención", "error", inicioGuardado);
        })
        .finally(() => {
          crmEstadoGuardado(false);
        });

    }

      document.getElementById("numOV").value = ""

      // 🔥 RESET COMPLETO DE ESTADOS
      document.getElementById("estadoPostCot").value = ""
      document.getElementById("estadoAvanzado").value = ""
      document.getElementById("estadoInicial").value = ""
      document.getElementById("asesor").value = ""

      // ocultar bloques
      document.getElementById("bloqueCotizacion").style.display = "none"
      document.getElementById("bloqueGestionCot").style.display = "none"
      document.getElementById("bloqueOV").style.display = "none"
      document.getElementById("bloquePerdido").style.display = "none"
      document.getElementById("bloqueEstadoPostCot").style.display = "none"

      document.getElementById("idLead").focus()

    }

    //sección de Cotizado
    document.getElementById("estadoAvanzado")
      .addEventListener("change", function () {

        if (this.value == "COTIZADO") {

          document.getElementById("bloquePerdido").style.display = "none"

          document.getElementById("bloqueCotizacion").style.display = "block"
          document.getElementById("bloqueGestionCot").style.display = "block"
          crmModoCotizacion("")

          const sel = document.getElementById("listaCotizaciones")
          sel.innerHTML = ""

          if (window.historialLead) {

            let op0 = document.createElement("option")
            op0.text = "N° de Cotización"
            op0.value = ""
            sel.add(op0)

            const cots = [...new Set(window.historialLead.map(x => x.numCot).filter(Boolean))]

            cots.forEach(c => {
              let op = document.createElement("option")
              op.text = c
              op.value = c
              sel.add(op)
            })

            let opNew = document.createElement("option")
            opNew.text = "Nueva Cotización"
            opNew.value = "NEW"
            sel.add(opNew)

          }

        } if (this.value == "PERDIDO") {

          document.getElementById("bloqueCotizacion").style.display = "none"
          document.getElementById("bloqueGestionCot").style.display = "none"
          crmModoCotizacion("")

          document.getElementById("bloquePerdido").style.display = "block"

        } else if (this.value == "") {
          document.getElementById("bloqueCotizacion").style.display = "none"
          document.getElementById("bloqueGestionCot").style.display = "none"
          document.getElementById("bloquePerdido").style.display = "none"
          crmModoCotizacion("")
        }

      })

    document.getElementById("montoCot")
      .addEventListener("blur", function () {

        let v = this.value.replace(",", ".")

        if (v && !isNaN(v)) {
          this.value = Number(v).toFixed(2)
        }

      })

    document.getElementById("montoOV")
      .addEventListener("blur", function () {

        let v = this.value.replace(",", ".")

        if (v && !isNaN(v)) {
          this.value = Number(v).toFixed(2)
        }

      })

    document.getElementById("listaCotizaciones").addEventListener("change", function () {

      const num = this.value
      reiniciarDependenciasDeCotizacion()

      // 🔥 SI ESTÁ EN DEFAULT → OCULTAR TODO
      if (num === "") {

        // ❌ NO ocultar el contenedor
        // document.getElementById("bloqueGestionCot").style.display = "none"

        // ✅ SOLO ocultar inputs
        document.getElementById("bloqueCotizacion").style.display = "none"
        document.getElementById("bloqueEstadoPostCot").style.display = "none"
        document.getElementById("bloqueOV").style.display = "none"

        // limpiar campos
        document.getElementById("monedaCot").value = ""
        document.getElementById("montoCot").value = ""
        document.getElementById("numCot").value = ""
        crmModoCotizacion("")
        ocultarValoresSugeridosOV()

        return
      }

      // reset
      document.getElementById("bloqueEstadoPostCot").style.display = "none"

      if (num == "NEW") {

        document.getElementById("bloqueCotizacion").style.display = "block"
        ocultarValoresSugeridosOV()

        document.getElementById("monedaCot").value = ""
        document.getElementById("montoCot").value = ""
        document.getElementById("numCot").value = ""
        document.getElementById("numCot").readOnly = false
        crmModoCotizacion(
          "nueva",
          "Nueva cotización",
          "Ingresa el número, la moneda y el monto para crearla."
        )

        // Una cotización nueva debe guardarse antes de elegir su resultado comercial.
        document.getElementById("bloqueEstadoPostCot").style.display = "none"

        return
      }

      if (num) {

        const cot = window.historialLead.find(x => String(x.numCot).trim() == String(num).trim())

        if (cot) {

          document.getElementById("bloqueCotizacion").style.display = "block"

          document.getElementById("monedaCot").value = cot.monedaCot || ""
          document.getElementById("montoCot").value = cot.montoCot || ""
          document.getElementById("numCot").value = cot.numCot || ""
          document.getElementById("numCot").readOnly = true
          crmModoCotizacion(
            "edicion",
            "Editar cotización existente",
            "Cotización " + cot.numCot + ": actualiza moneda o monto."
          )

          // estado al final
          document.getElementById("bloqueEstadoPostCot").style.display = "block"

          // ===== CARGAR OVS AUTOMÁTICAMENTE =====
          const selOV = document.getElementById("listaOV")
          selOV.innerHTML = ""

          const ovs = (window.dataOVs && window.dataOVs[num]) || []

          if (ovs.length > 0) {

            let op0 = document.createElement("option")
            op0.text = "N° de Orden de Venta"
            op0.value = ""
            selOV.add(op0)

            ovs.forEach(o => {
              let op = document.createElement("option")
              op.text = o
              op.value = o
              selOV.add(op)
            })

            let opNew = document.createElement("option")
            opNew.text = "Nueva Orden de Venta"
            opNew.value = "NEW"
            selOV.add(opNew)

            selOV.style.display = "block"

          } else {
            selOV.style.display = "none"
          }
          if (document.getElementById("estadoPostCot").value === "CERRADO") {
            document.getElementById("bloqueOV").style.display = "block"
            sugerirValoresOVDesdeCotizacion()
          }
        }

      }

    })

    document.getElementById("estadoPostCot").addEventListener("change", function () {

      const estado = this.value

      if (this.value !== "PERDIDO") {
        document.getElementById("bloquePerdido").style.display = "none"
      }
      document.getElementById("bloqueOV").style.display = "none"
      if (estado !== "CERRADO") ocultarValoresSugeridosOV()
      if (this.value === "CERRADO") {
        document.getElementById("bloqueEstadoAvanzado").style.display = "none"
      }

      if (estado === "CERRADO") {

        document.getElementById("bloqueCotizacion").style.display = "none"
        document.getElementById("bloqueOV").style.display = "block"
        sugerirValoresOVDesdeCotizacion()

      }

      if (estado === "PERDIDO") {

        document.getElementById("bloqueCotizacion").style.display = "none"
        document.getElementById("bloqueOV").style.display = "none"
        document.getElementById("bloquePerdido").style.display = "block"
        ocultarValoresSugeridosOV()

      }

      if (estado === "COTIZADO") {

        document.getElementById("bloqueEstadoPostCot").style.display = "none"

        document.getElementById("bloqueGestionCot").style.display = "block"
        document.getElementById("bloqueCotizacion").style.display = "block"
        document.getElementById("bloqueOV").style.display = "none"
        document.getElementById("bloquePerdido").style.display = "none"
        ocultarValoresSugeridosOV()

      }

    })

    document.getElementById("listaOV").addEventListener("change", function () {

      const numOV = this.value

      if (!numOV || numOV == "NEW") {
        sugerirValoresOVDesdeCotizacion()
        return

      }

      const ov = window.historialLead.find(x =>
        String(x.numOV).trim() === String(numOV).trim()
      )

      if (ov) {

        document.getElementById("monedaOV").value = ov.monedaOV || ""
        document.getElementById("montoOV").value = ov.montoOV || ""
        document.getElementById("numOV").value = ov.numOV || ""
        document.getElementById("numOV").readOnly = true
        ocultarValoresSugeridosOV()

      }

    })

    limitarCampoANumeros("numCot", 6)
    limitarCampoANumeros("numOV", 5)

    document.getElementById("idLead")
      .addEventListener("keypress", function (e) {

        if (e.key === "Enter") {
          e.preventDefault()
          buscar()
        }

      })

    const eventosDeCampo = ["input", "change"]
    eventosDeCampo.forEach(evento => {
      document.addEventListener(evento, function (e) {
        if (e.target.id) crmLimpiarErrorCampo(e.target.id)
      })
    })

  </script>

</body>

</html>
